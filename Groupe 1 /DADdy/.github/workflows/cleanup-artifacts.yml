name: Cleanup old artifacts

on:
  schedule:
    - cron: "0 3 * * *"   # daily 03:00 UTC
  workflow_dispatch:
    inputs:
      max_age_days:
        description: "Delete artifacts older than this many days"
        default: "7"
        required: false

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: self-hosted
    steps:
      - name: Delete old artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const maxAgeDays = Number(context.payload.inputs?.max_age_days || 7);
            const cutoff = Date.now() - maxAgeDays * 24 * 60 * 60 * 1000;
            const arts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );
            let deleted = 0;
            for (const a of arts) {
              if (new Date(a.created_at).getTime() < cutoff) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: a.id,
                });
                deleted++;
              }
            }
            core.info(`Deleted ${deleted} of ${arts.length} artifacts (older than ${maxAgeDays}d)`);
