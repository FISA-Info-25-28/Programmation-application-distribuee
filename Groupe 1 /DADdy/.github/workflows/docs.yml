name: CI/CD Docs

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches:
      - main
      - develop
      - 'feature-*'
      - '*'
  pull_request:
    branches:
      - main
      - develop
      - 'feature-*'
      - '*'

jobs:
  build-docs:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.base_ref == 'main' || github.base_ref == 'develop'
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build documentation
        run: npm run build:docs

      - name: Upload docs artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: docs-site
          path: docs
          # Only a handoff to deploy-docs in the same run; keep the minimum.
          retention-days: 1

  deploy-docs:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    needs: build-docs
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Download docs artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: docs-site
          path: _site

      - name: Install rsync
        run: sudo apt-get install -y rsync

      - name: Deploy to gh-pages (dev/prod)
        shell: bash
        run: |
          set -euo pipefail

          TARGET_DIR="dev"
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            TARGET_DIR="prod"
          fi

          git fetch origin gh-pages || true
          git worktree prune
          rm -rf _deploy

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git worktree add _deploy origin/gh-pages
          else
            git worktree add -b gh-pages _deploy
          fi

          mkdir -p "_deploy/${TARGET_DIR}"
          rsync -a --delete _site/ "_deploy/${TARGET_DIR}/"

          cat > _deploy/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>DADdy Docs</title>
              <style>
                body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; margin: 40px; }
                a { display: inline-block; margin-right: 16px; font-weight: 600; }
              </style>
            </head>
            <body>
              <h1>DADdy Documentation</h1>
              <p>Available environments:</p>
              <a href="./prod/">Production Docs</a>
              <a href="./dev/">Development Docs</a>
            </body>
          </html>
          EOF

          touch _deploy/.nojekyll

          cd _deploy
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No documentation changes to deploy."
            exit 0
          fi

          git commit -m "docs: deploy ${TARGET_DIR} (${GITHUB_SHA})"
          git push origin HEAD:gh-pages