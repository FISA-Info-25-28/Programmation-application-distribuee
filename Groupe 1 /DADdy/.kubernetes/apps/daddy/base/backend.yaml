apiVersion: v1
kind: Service
metadata:
  name: core-api
spec:
  selector:
    app: core-api
  ports:
    - name: http
      port: 3101
      targetPort: 3101
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: core-api
  template:
    metadata:
      labels:
        app: core-api
    spec:
      containers:
        - name: core-api
          image: daddy-core-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3101
          env:
            - name: PORT
              value: "3101"
            - name: CORE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: daddy-app-secrets
                  key: CORE_DATABASE_URL
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: daddy-app-secrets
                  key: INTERNAL_API_KEY
          readinessProbe: &coreHealth
            httpGet:
              path: /health
              port: 3101
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe: *coreHealth
          startupProbe:
            <<: *coreHealth
            failureThreshold: 30
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
spec:
  selector:
    app: user-service
  ports:
    - name: http
      port: 3102
      targetPort: 3102
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: daddy-user-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3102
          env:
            - name: PORT
              value: "3102"
            - name: USER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: daddy-app-secrets
                  key: USER_DATABASE_URL
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: daddy-app-secrets
                  key: INTERNAL_API_KEY
            - name: NOTIF_SERVICE_URL
              value: http://notif-service:3106
            # Permet au user-service de propager une sanction (ban/suspension) à
            # l'auth-service : blocage du login + révocation immédiate des sessions.
            - name: AUTH_SERVICE_URL
              value: http://auth-service:3104
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: daddy-app-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: daddy-app-secrets
                  key: MINIO_ROOT_PASSWORD
          envFrom:
            - configMapRef:
                name: daddy-shared-config
          readinessProbe: &userHealth
            httpGet:
              path: /health
              port: 3102
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe: *userHealth
          startupProbe:
            <<: *userHealth
            failureThreshold: 30
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
