apiVersion: v1
kind: Service
metadata:
  name: cache
spec:
  selector:
    app: cache
  ports:
    - name: valkey
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cache
  template:
    metadata:
      labels:
        app: cache
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 1000
      containers:
        - name: cache
          image: valkey/valkey:8-alpine
          command:
            - valkey-server
          args:
            - --save
            - ""
            - --maxmemory
            - 128mb
            - --maxmemory-policy
            - allkeys-lru
            - --requirepass
            - $(VALKEY_PASSWORD)
          ports:
            - containerPort: 6379
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: daddy-app-secrets
                  key: VALKEY_PASSWORD
          readinessProbe: &valkeyHealth
            exec:
              command:
                - sh
                - -c
                - valkey-cli -a "$VALKEY_PASSWORD" ping | grep -q PONG
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe: *valkeyHealth
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
