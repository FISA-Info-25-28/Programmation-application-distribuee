apiVersion: v1
kind: ConfigMap
metadata:
  name: daddy-shared-config
data:
  APP_ENV: development
  JWT_ISSUER: daddy-auth
  JWT_AUDIENCE: daddy-api
  JWT_ALG: HS256
  JWT_ACTIVE_KID: v1
  JWT_PREVIOUS_SECRET: ""
  JWT_PREVIOUS_KID: ""
  JWT_PRIVATE_KEY_PATH: ""
  JWT_PUBLIC_KEY_PATH: ""
  JWT_PREVIOUS_PUBLIC_KEY_PATH: ""
  JWT_LEEWAY_SECONDS: "30"
  JWT_MAX_TOKEN_AGE_MINUTES: "20"
  ACCESS_TOKEN_TTL_MINUTES: "15"
  REFRESH_TOKEN_TTL_DAYS: "30"
  RATE_LIMIT_AUTH_PER_MIN: "10"
  RATE_LIMIT_API_PER_MIN: "120"
  MINIO_ENDPOINT: minio:9000
  MINIO_BUCKET: breezy-media
  MINIO_PUBLIC_URL: http://minio:9000
