apiVersion: v1
kind: Secret
metadata:
  name: daddy-db-secrets
type: Opaque
stringData:
  CORE_POSTGRES_USER: core_user
  CORE_POSTGRES_PASSWORD: replace-me-prod-core
  CORE_POSTGRES_DB: core
  USER_POSTGRES_USER: user_user
  USER_POSTGRES_PASSWORD: replace-me-prod-user
  USER_POSTGRES_DB: users
  AUTH_POSTGRES_USER: auth_user
  AUTH_POSTGRES_PASSWORD: replace-me-prod-auth
  AUTH_POSTGRES_DB: auth
  POST_POSTGRES_USER: post_user
  POST_POSTGRES_PASSWORD: replace-me-prod-post
  POST_POSTGRES_DB: posts
  MSG_POSTGRES_USER: msg_user
  MSG_POSTGRES_PASSWORD: replace-me-prod-msg
  MSG_POSTGRES_DB: messages
  NOTIF_POSTGRES_USER: notif_user
  NOTIF_POSTGRES_PASSWORD: replace-me-prod-notif
  NOTIF_POSTGRES_DB: notifications
---
apiVersion: v1
kind: Secret
metadata:
  name: daddy-app-secrets
type: Opaque
stringData:
  JWT_SECRET: replace-me-prod-jwt-secret
  INTERNAL_API_KEY: replace-me-prod-internal-api-key
  VALKEY_PASSWORD: replace-me-prod-valkey-password
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: replace-me-prod-minio
  CORE_DATABASE_URL: postgres://core_user:replace-me-prod-core@core-db:5432/core?sslmode=disable
  USER_DATABASE_URL: postgres://user_user:replace-me-prod-user@user-db:5432/users?sslmode=disable
  AUTH_DATABASE_URL: postgres://auth_user:replace-me-prod-auth@auth-db:5432/auth?sslmode=disable
  POST_DATABASE_URL: postgres://post_user:replace-me-prod-post@post-db:5432/posts?sslmode=disable
  MSG_DATABASE_URL: postgres://msg_user:replace-me-prod-msg@msg-db:5432/messages?sslmode=disable
  NOTIF_DATABASE_URL: postgres://notif_user:replace-me-prod-notif@notif-db:5432/notifications?sslmode=disable
