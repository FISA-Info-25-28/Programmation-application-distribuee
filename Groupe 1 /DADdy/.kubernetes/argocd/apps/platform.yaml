apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: daddy
  source:
    repoURL: https://github.com/enzo-cadiere/DADdy.git
    targetRevision: HEAD
    path: .kubernetes/platform/bootstrap/shared
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
