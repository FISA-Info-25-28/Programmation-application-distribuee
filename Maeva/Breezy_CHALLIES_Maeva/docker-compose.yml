name: breezy

services:
  postgres:
    image: postgres:16-alpine
    container_name: breezy-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d postgres"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - breezy-network

  auth-service:
    build:
      context: ./services/auth-service

    container_name: breezy-auth-service
    restart: unless-stopped

    environment:
      PORT: 3001
      DATABASE_URL: ${AUTH_DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      PROFILE_SERVICE_INTERNAL_URL: ${PROFILE_SERVICE_INTERNAL_URL}

    depends_on:
      postgres:
        condition: service_healthy

    expose:
      - "3001"

    networks:
      - breezy-network

  profile-service:
    build:
      context: ./services/profile-service

    container_name: breezy-profile-service
    restart: unless-stopped

    environment:
      PORT: 3002
      DATABASE_URL: ${PROFILE_DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}

    depends_on:
      postgres:
        condition: service_healthy

    expose:
      - "3002"

    networks:
      - breezy-network

  post-service:
    build:
      context: ./services/post-service

    container_name: breezy-post-service
    restart: unless-stopped

    environment:
      PORT: 3003
      DATABASE_URL: ${POST_DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      postgres:
        condition: service_healthy

    expose:
      - "3003"

    networks:
      - breezy-network

  gateway:
    image: nginx:1.27-alpine
    container_name: breezy-gateway
    restart: unless-stopped

    ports:
      - "8080:80"

    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - auth-service
      - profile-service
      - post-service

    networks:
      - breezy-network

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

    container_name: breezy-frontend
    restart: unless-stopped

    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

    ports:
      - "3000:3000"

    networks:
      - breezy-network

volumes:
  postgres-data:

networks:
  breezy-network:
    driver: bridge