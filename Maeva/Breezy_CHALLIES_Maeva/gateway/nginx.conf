events {
}

http {
    # Résolution DNS dynamique via le resolver Docker interne.
    # Quand les services redémarrent et changent d'IP, nginx re-résout
    # automatiquement les noms toutes les 10 secondes.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        # Variables pour forcer la résolution DNS à chaque requête.
        set $auth_backend    "http://auth-service:3001";
        set $profile_backend "http://profile-service:3002";
        set $post_backend    "http://post-service:3003";
        set $auth_health     "http://auth-service:3001/health";
        set $profile_health  "http://profile-service:3002/health";
        set $post_health     "http://post-service:3003/health";

        # CORS : le frontend (http://localhost:3000) appelle le gateway
        # (http://localhost:8080) depuis le navigateur, ce qui constitue une
        # requête cross-origin. Le jeton circule en Bearer (pas de cookie),
        # une origine ouverte suffit donc pour ce MVP de développement.
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Max-Age 86400 always;

        # Réponse immédiate aux requêtes de pré-vérification (preflight).
        if ($request_method = OPTIONS) {
            return 204;
        }

        location = /health {
            add_header Content-Type application/json;
            return 200 '{"status":"ok","service":"gateway"}';
        }

        location = /api/auth/health {
            proxy_pass $auth_health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/auth/ {
            proxy_pass $auth_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Route spéciale destinée au health check du Profile Service.
        location = /api/profile/health {
            proxy_pass $profile_health;

            # Transmission des informations de la requête initiale.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Transmission des autres routes /api/profile au Profile Service.
        location /api/profile/ {
            proxy_pass $profile_backend;

            # Conservation des informations du client.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/posts/health {
            proxy_pass $post_health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/posts/ {
            proxy_pass $post_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}